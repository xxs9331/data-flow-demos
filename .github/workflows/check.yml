name: Check demos and links
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm run demo
      - name: Verify standalone file
        shell: bash
        run: |
          DEMO_CHECK_DIR=$(mktemp -d)
          cp demos/state/expiring-unread/demo.mjs "$DEMO_CHECK_DIR/demo.mjs"
          node "$DEMO_CHECK_DIR/demo.mjs"
